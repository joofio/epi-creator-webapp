<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0"
            crossorigin="anonymous"></script>
    <style>
        .container { margin-top: 60px; max-width: 700px; }
        .hero { text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>ePI Creator</h1>
        <p class="lead mt-3">Create FHIR ePI resources using a guided step-by-step wizard. No Excel required.</p>
        <p class="text-muted">Fill in the forms across 11 steps to generate a complete FHIR package with FSH and JSON resources.</p>

        <form method="post" action="{{ url_for('gh_epi_creator.wizard_new') }}" class="mt-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-primary btn-lg px-5">Start Wizard</button>
        </form>

        <div class="mt-4">
            <p>
                <a href="{{ url_for('gh_epi_creator.faq') }}">FAQ &amp; Resource Relationships</a> |
                <a href="http://build.fhir.org/ig/HL7/emedicinal-product-info/artifacts.html">FHIR Profiles</a> |
                <a href="http://build.fhir.org/ig/hl7-eu/gravitate-health/">Gravitate Health IG</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
