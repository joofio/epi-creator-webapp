{% extends "wizard/base.html" %}
{% block content %}
<h2>Substance</h2>
<p class="section-description">Define the active substance(s). Add one row per substance.</p>

<form method="post"
      hx-post="{{ url_for('gh_epi_creator.wizard_submit', step=step) }}"
      hx-target="body" hx-swap="outerHTML">
    <input type="hidden" name="row_count" value="{{ rows|length if rows else 1 }}">

    <div id="substance-rows">
        {% set row_list = rows if rows and rows|length > 0 else [{}] %}
        {% for row in row_list %}
        <div class="card-entry mb-3">
            <div class="card-entry-header">
                <strong>Substance #{{ loop.index }}</strong>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.card-entry').remove(); updateRowCount();">Remove</button>
            </div>
            <div class="row g-2">
                <div class="col-md-6"><label class="form-label">Name *</label><input class="form-control" name="name_{{ loop.index0 }}" value="{{ row.get('name','') }}"></div>
                <div class="col-md-3"><label class="form-label">Identifier (GSRS)</label><input class="form-control" name="identifier_{{ loop.index0 }}" value="{{ row.get('identifier','') }}"></div>
                <div class="col-md-3"><label class="form-label">Version</label><input class="form-control" name="version_{{ loop.index0 }}" value="{{ row.get('version','') }}"></div>
                <div class="col-md-12"><label class="form-label">Description</label><textarea class="form-control" name="description_{{ loop.index0 }}" rows="2">{{ row.get('description','') }}</textarea></div>
                <div class="col-md-4"><label class="form-label">Molecular Formula</label><input class="form-control" name="molecularFormula_{{ loop.index0 }}" value="{{ row.get('molecularFormula','') }}"></div>
                <div class="col-md-4"><label class="form-label">Molecular Weight (pipe-delimited)</label><input class="form-control" name="moleclularWeigth_{{ loop.index0 }}" value="{{ row.get('moleclularWeigth','') }}" placeholder="e.g. 250|500"></div>
                <div class="col-md-4"><label class="form-label">Weight Type (pipe-delimited)</label><input class="form-control" name="moleclularWeigthType_{{ loop.index0 }}" value="{{ row.get('moleclularWeigthType','') }}" placeholder="e.g. base|salt"></div>
            </div>
            <div class="row g-2 mt-1">
                <div class="col-md-6"><label class="form-label">Alt. Name</label><input class="form-control" name="name_name_{{ loop.index0 }}" value="{{ row.get('name_name','') }}"></div>
                <div class="col-md-3"><label class="form-label">Name Type</label><input class="form-control" name="name_type_{{ loop.index0 }}" value="{{ row.get('name_type','') }}"></div>
                <div class="col-md-3"><label class="form-label">Name Type ID</label><input class="form-control" name="name_typeID_{{ loop.index0 }}" value="{{ row.get('name_typeID','') }}"></div>
                <input type="hidden" name="id_{{ loop.index0 }}" value="{{ row.get('id','') }}">
            </div>
        </div>
        {% endfor %}
    </div>

    <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addRow()">+ Add Substance</button>

    <div class="d-flex justify-content-between mt-4">
        <a href="{{ url_for('gh_epi_creator.wizard_step', step=steps[steps.index(step)-1]) }}" class="btn btn-outline-secondary btn-nav">Back</a>
        <button type="submit" class="btn btn-primary btn-nav">Save &amp; Next</button>
    </div>
</form>

<script>
let rowCounter = {{ row_list|length if row_list else 1 }};
function addRow() {
    const c = document.getElementById('substance-rows');
    const d = document.createElement('div');
    d.className = 'card-entry mb-3';
    d.innerHTML = `<div class="card-entry-header"><strong>Substance #${rowCounter+1}</strong><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.card-entry').remove(); updateRowCount();">Remove</button></div>
    <div class="row g-2"><div class="col-md-6"><label class="form-label">Name *</label><input class="form-control" name="name_${rowCounter}"></div><div class="col-md-3"><label class="form-label">Identifier (GSRS)</label><input class="form-control" name="identifier_${rowCounter}"></div><div class="col-md-3"><label class="form-label">Version</label><input class="form-control" name="version_${rowCounter}"></div><div class="col-md-12"><label class="form-label">Description</label><textarea class="form-control" name="description_${rowCounter}" rows="2"></textarea></div><div class="col-md-4"><label class="form-label">Molecular Formula</label><input class="form-control" name="molecularFormula_${rowCounter}"></div><div class="col-md-4"><label class="form-label">Molecular Weight</label><input class="form-control" name="moleclularWeigth_${rowCounter}" placeholder="e.g. 250|500"></div><div class="col-md-4"><label class="form-label">Weight Type</label><input class="form-control" name="moleclularWeigthType_${rowCounter}" placeholder="e.g. base|salt"></div></div><div class="row g-2 mt-1"><div class="col-md-6"><label class="form-label">Alt. Name</label><input class="form-control" name="name_name_${rowCounter}"></div><div class="col-md-3"><label class="form-label">Name Type</label><input class="form-control" name="name_type_${rowCounter}"></div><div class="col-md-3"><label class="form-label">Name Type ID</label><input class="form-control" name="name_typeID_${rowCounter}"></div><input type="hidden" name="id_${rowCounter}"></div>`;
    c.appendChild(d); rowCounter++; updateRowCount();
}
function updateRowCount() {
    const rows = document.querySelectorAll('#substance-rows .card-entry');
    document.querySelector('input[name="row_count"]').value = rows.length;
    rows.forEach((r,i) => { r.querySelector('strong').textContent = 'Substance #'+(i+1); r.querySelectorAll('input,textarea').forEach(el => el.name = el.name.replace(/_\d+$/,'_'+i)); });
    rowCounter = rows.length;
}
</script>
{% endblock %}
