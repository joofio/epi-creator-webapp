{% extends base_template %}
{% block content %}
<h2>Regulated Authorization</h2>
<p class="section-description">Marketing authorization details. Add one row per authorization.</p>

<form method="post"
      hx-target="#wizard-container" hx-swap="innerHTML" hx-post="{{ url_for('gh_epi_creator.wizard_submit', step=step) }}"
      >
    <input type="hidden" name="row_count" value="{{ rows|length if rows else 1 }}">

    <div id="rows">
        {% set row_list = rows if rows and rows|length > 0 else [{}] %}
        {% for row in row_list %}
        <div class="card-entry mb-3">
            <div class="card-entry-header">
                <strong>Authorization #{{ loop.index }}</strong>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.card-entry').remove(); updateRowCount();">Remove</button>
            </div>
            <div class="row g-2">
                <div class="col-md-3"><label class="form-label">Identifier</label><input class="form-control" name="identifier_{{ loop.index0 }}" value="{{ row.get('identifier','') }}"></div>
                <div class="col-md-2"><label class="form-label">Status Date</label><input type="date" class="form-control" name="statusDate_{{ loop.index0 }}" value="{{ row.get('statusDate','') }}"></div>
                <div class="col-md-3"><label class="form-label">Type</label><input class="form-control" name="type_{{ loop.index0 }}" value="{{ row.get('type','') }}" placeholder="e.g. Marketing Authorisation"></div>
                <div class="col-md-2"><label class="form-label">Type ID</label><input class="form-control" name="typeID_{{ loop.index0 }}" value="{{ row.get('typeID','') }}"></div>
                <div class="col-md-2">
                    <label class="form-label">Reference</label>
                    <select class="form-select" name="reference_{{ loop.index0 }}">
                        <option value="">-- Select --</option>
                        <option value="MedicinalProduct" {% if row.get('reference','')=='MedicinalProduct' %}selected{% endif %}>Medicinal Product</option>
                        <option value="PackagedProduct" {% if row.get('reference','')=='PackagedProduct' %}selected{% endif %}>Packaged Product</option>
                    </select>
                </div>
            </div>
            <div class="row g-2 mt-1">
                <div class="col-md-3"><label class="form-label">Region</label><input class="form-control" name="region_{{ loop.index0 }}" value="{{ row.get('region','') }}"></div>
                <div class="col-md-2"><label class="form-label">Region ID</label><input class="form-control" name="regionID_{{ loop.index0 }}" value="{{ row.get('regionID','') }}"></div>
                <input type="hidden" name="id_{{ loop.index0 }}" value="{{ row.get('id','') }}">
            </div>
        </div>
        {% endfor %}
    </div>

    <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addRow()">+ Add Authorization</button>

    <div class="d-flex justify-content-between mt-4">
        <a href="{{ url_for('gh_epi_creator.wizard_step', step=steps[steps.index(step)-1]) }}" class="btn btn-outline-secondary btn-nav">Back</a>
        <button type="submit" class="btn btn-primary btn-nav">Save &amp; Next</button>
    </div>
</form>

<script>
let rc = {{ row_list|length if row_list else 1 }};
function addRow() { const c=document.getElementById('rows'), d=document.createElement('div'); d.className='card-entry mb-3'; d.innerHTML=`<div class="card-entry-header"><strong>Authorization #${rc+1}</strong><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.card-entry').remove();updateRowCount()">Remove</button></div><div class="row g-2"><div class="col-md-3"><label class="form-label">Identifier</label><input class="form-control" name="identifier_${rc}"></div><div class="col-md-2"><label class="form-label">Status Date</label><input type="date" class="form-control" name="statusDate_${rc}"></div><div class="col-md-3"><label class="form-label">Type</label><input class="form-control" name="type_${rc}" placeholder="e.g. Marketing Authorisation"></div><div class="col-md-2"><label class="form-label">Type ID</label><input class="form-control" name="typeID_${rc}"></div><div class="col-md-2"><label class="form-label">Reference</label><select class="form-select" name="reference_${rc}"><option value="">-- Select --</option><option>MedicinalProduct</option><option>PackagedProduct</option></select></div></div><div class="row g-2 mt-1"><div class="col-md-3"><label class="form-label">Region</label><input class="form-control" name="region_${rc}"></div><div class="col-md-2"><label class="form-label">Region ID</label><input class="form-control" name="regionID_${rc}"></div><input type="hidden" name="id_${rc}"></div>`; c.appendChild(d); rc++; updateRowCount(); }
function updateRowCount() { const rows = document.querySelectorAll('#rows .card-entry'); document.querySelector('input[name="row_count"]').value = rows.length; rows.forEach((r,i) => { r.querySelector('strong').textContent='Authorization #'+(i+1); r.querySelectorAll('input,select').forEach(el => el.name = el.name.replace(/_\d+$/,'_'+i)); }); rc=rows.length; }
</script>
{% endblock %}
